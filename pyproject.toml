[project]
name = "vkv-backend"
version = "1.0.0"
description = "VKV Ağ sunucusu. Talepler, mesajlar ve dosyalar burada durur."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vkv-backend = "vkv_backend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vkv_backend*"]
